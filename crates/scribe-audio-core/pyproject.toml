[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "scribe-audio-core"
version = "0.1.0"
description = "Native Rust extension for high-performance audio processing"
# The cap stays until torch and CTranslate2 publish cp315 wheels.
requires-python = ">=3.11,<3.15"
authors = [{name = "Nick Seal"}]
license = "Apache-2.0"
dynamic = ["classifiers"]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "scribe_audio_core"
