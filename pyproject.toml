[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scribe"
version = "2.4.3"
description = "Professional GPU-accelerated speech-to-text transcription system"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "blissplixel", email = "blissplixel@users.noreply.github.com"}
]
keywords = ["transcription", "speech-to-text", "whisper", "gpu", "openai", "batch-processing", "custom-vocabulary"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "faster-whisper>=0.10.0",
    "openai>=1.0.0",
    "pydub>=0.25.1",
    "numpy>=1.24.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0",
    "python-docx>=1.0.0",
    "obsws-python>=1.5.0",
    "httpx>=0.24.0",
    "tenacity>=8.2.0",
    "yt-dlp>=2025.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-tqdm",
    "types-requests",
]

whisperx = [
    "whisperx>=3.1.0",
    "pyannote.audio>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/blissplixel/scribe"
Repository = "https://github.com/blissplixel/scribe"
Issues = "https://github.com/blissplixel/scribe/issues"

[project.scripts]
scribe = "scribe.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scribe = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "archive",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "S",      # flake8-bandit (security)
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by ruff format)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex (use with care; prefer focused functions)
    "ARG001", # unused function argument (legacy test/style debt)
    "ARG002", # unused method argument (legacy test/style debt)
    "B017",   # broad exception assertion in tests
    "B904",   # raise-without-from in legacy code paths
    "E402",   # module import not at top of file in tests/scripts
    "SIM102", # collapsible-if (readability tradeoff)
    "SIM108", # ternary simplification preference
    "SIM115", # open-file-with-context-handler in legacy paths
    "SIM116", # dict-lookup simplification preference
    "SIM117", # combine nested with statements
]
extend-select = ["I", "UP", "B", "S"]

# Intentional typographic characters (kept for professional CLI output and docs)
allowed-confusables = ["×", "–", "—"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py (intentional re-exports)
"tests/**/*" = [
    "S101",  # allow assert in tests
    "S108",  # hardcoded temp paths are fine and common in test fixtures
    "S110",  # bare except: pass is common in test setup/teardown for expected side effects
    "S112",  # except: continue same pattern
    "S603",  # subprocess calls when testing real CLI/device startup paths
    "S607",  # partial executable paths in the same test contexts
]  # Test-only security lints that do not reflect production risk

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
exclude = [
    "archive/",
    "build/",
    "dist/",
]

[[tool.mypy.overrides]]
module = [
    "faster_whisper.*",
    "whisperx.*",
    "pydub.*",
    "obsws_python.*",
    "torchaudio.*",
]
ignore_missing_imports = true

[tool.uv]
python-preference = "only-managed"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "hypothesis>=6.0",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pip-audit>=2.7",
    "types-tqdm",
    "types-requests",
]

[tool.uv.sources]
# Add any private indexes or workspace members here when needed.

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=scribe",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU (deselect with '-m \"not gpu\"')",
    "windows: marks tests specific to Windows",
    "macos: marks tests specific to macOS",
    "linux: marks tests specific to Linux",
    "integration: marks integration tests",
    "e2e: marks end-to-end tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
fail_under = 87  # Raised in Step 3; target 90%+ in later steps as more pure logic gets property tests
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]





