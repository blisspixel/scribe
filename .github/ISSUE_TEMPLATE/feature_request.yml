name: Feature request
description: Propose a focused improvement to Scribe
title: "feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user need without including private recordings, transcripts, or organizational details.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the smallest useful change and how a user would invoke it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or smaller options.
  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundary review
      options:
        - label: I considered local-first behavior, cloud transmission, cost, consent, privacy, and platform support.
          required: true
        - label: This request contains no sensitive or identifying data.
          required: true
