name: Bug report
description: Report a reproducible problem with Scribe
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, recordings, transcripts, private paths, or other sensitive data. Use synthetic inputs and redact diagnostic output.
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest commands and synthetic input needed to reproduce the problem.
      placeholder: |
        1. Install...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Scribe version or commit
      placeholder: "scribe 2.8.1 or a commit SHA"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "Operating system, Python version, and selected local backend"
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Paste only the relevant, reviewed output from `scribe doctor` or a minimal traceback.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Data check
      options:
        - label: I removed credentials, real recordings and transcripts, personal data, and private paths.
          required: true
        - label: I used a synthetic or otherwise authorized reproduction.
          required: true
