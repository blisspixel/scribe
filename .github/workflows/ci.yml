name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Consistent environment variables for all jobs
  UV_CACHE_DIR: /tmp/uv-cache
  # Test keys so providers don't fail during import/config
  OPENAI_API_KEY: sk-test-key
  XAI_API_KEY: test-key
  GEMINI_API_KEY: test-key
  ANTHROPIC_API_KEY: test-key

jobs:
  # ---------------------------------------------------------------------------
  # Lint + Format + Type Checking
  # Fastest failing job. Enforces Ruff (format + lint) + mypy --strict on the package.
  # This is the Engineering Excellence static quality gate (Step 1 + Step 2 foundation).
  # ---------------------------------------------------------------------------
  lint-and-types:
    name: Lint + Format + Types (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Setup Python 3.12
        run: uv python install 3.12

      - name: Sync environment (dev group)
        run: uv sync --group dev

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: mypy --strict (package)
        run: uv run mypy --strict src/scribe

  # ---------------------------------------------------------------------------
  # Test Matrix (fast CI-safe subset)
  # Runs the non-GPU, non-slow unit tests across supported Python versions (3.12/3.13).
  # Full suite (including integration) runs locally and is too heavy/sensitive for GitHub runners.
  # ---------------------------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Setup Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync environment (dev group)
        run: uv sync --group dev

      - name: Run CI-safe test subset (fast feedback across Python matrix)
        run: |
          uv run pytest tests/unit \
            -m "not gpu and not slow and not requires_openai and not requires_ffmpeg and not requires_whisperx" \
            --maxfail=1 -q

  # ---------------------------------------------------------------------------
  # Coverage Gate
  # Enforce the 85%+ branch coverage gate (pyproject.toml [tool.coverage.report] + explicit flag).
  # Part of the Engineering Excellence foundation. Fails the build on regression.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage (Python 3.12)
    runs-on: ubuntu-latest
    needs: [lint-and-types]  # Only run if static checks passed

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Setup Python 3.12
        run: uv python install 3.12

      - name: Sync environment (dev group)
        run: uv sync --group dev

      - name: Run tests with coverage (fail under 85%)
        run: |
          uv run pytest \
            --cov=scribe \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=87 \
            -m "not gpu and not slow and not requires_openai and not requires_ffmpeg and not requires_whisperx" \
            --maxfail=1 -q

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Dependency Security Audit
  # Fail on known high/critical vulnerabilities. Part of the Engineering Excellence security posture.
  # OpenSSF-inspired: no high/critical vulns allowed in the lockfile.
  # ---------------------------------------------------------------------------
  security:
    name: Dependency Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Setup Python 3.12
        run: uv python install 3.12

      - name: Sync environment (dev group)
        run: uv sync --group dev

      - name: Run pip-audit (fail on high/critical)
        run: uv run pip-audit --progress-spinner off --desc on --fail-on high

  # ---------------------------------------------------------------------------
  # Toolchain Sanity Check
  # Exercises uv + pre-commit end-to-end. Non-blocking during elevation (continue-on-error)
  # so we can see what the hooks would do without blocking the foundation PRs.
  # Will become fully gating after Step 2 Ruff enforcement.
  # ---------------------------------------------------------------------------
  toolchain-check:
    name: Toolchain Sanity (uv + pre-commit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Setup Python 3.12
        run: uv python install 3.12

      - name: Sync + pre-commit install
        run: |
          uv sync --group dev
          uv run pre-commit install --install-hooks

      - name: Run pre-commit (advisory during foundation work)
        continue-on-error: true
        run: uv run pre-commit run --all-files --show-diff-on-failure

  # ---------------------------------------------------------------------------
  # CI Gate Aggregator
  # Single status that can be required in branch protection rules.
  # All of lint-and-types, test (matrix), coverage (85% gate), and security must pass.
  # ---------------------------------------------------------------------------
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [lint-and-types, test, coverage, security]
    if: always()

    steps:
      - name: Verify all required gates passed
        shell: bash
        run: |
          echo "CI gate results:"
          echo "  lint-and-types: ${{ needs.lint-and-types.result }}"
          echo "  test:           ${{ needs.test.result }}"
          echo "  coverage:       ${{ needs.coverage.result }}"
          echo "  security:       ${{ needs.security.result }}"

          failed=0
          for result in "${{ needs.lint-and-types.result }}" \
                        "${{ needs.test.result }}" \
                        "${{ needs.coverage.result }}" \
                        "${{ needs.security.result }}"; do
            if [[ "$result" != "success" ]]; then
              failed=1
            fi
          done

          if [[ $failed -eq 1 ]]; then
            echo "❌ One or more required CI gates failed. See job logs above."
            exit 1
          fi

          echo "✅ All required CI gates passed."
