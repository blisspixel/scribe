name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Critical (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run Ruff (critical rules only)
        run: ruff check src --select F,E9 --ignore F401

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run unit tests (CI-safe subset)
        env:
          OPENAI_API_KEY: test-key
          XAI_API_KEY: test-key
          GEMINI_API_KEY: test-key
          ANTHROPIC_API_KEY: test-key
        run: |
          pytest tests/unit -m "not gpu and not slow and not requires_openai and not requires_ffmpeg and not requires_whisperx" --maxfail=1

  coverage:
    name: Coverage (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run unit tests with coverage
        env:
          OPENAI_API_KEY: test-key
          XAI_API_KEY: test-key
          GEMINI_API_KEY: test-key
          ANTHROPIC_API_KEY: test-key
        run: |
          pytest tests/unit -m "not gpu and not slow and not requires_openai and not requires_ffmpeg and not requires_whisperx" --cov=scribe --cov-report=xml --cov-report=term --maxfail=1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
