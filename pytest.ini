[pytest]
# Pytest configuration for Scribe test suite

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 6.0

# Add current directory to Python path
pythonpath = .

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes

# Custom markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    e2e: End-to-end tests for complete workflows
    slow: Tests that take significant time to run
    gpu: Tests that require GPU/CUDA
    windows: Tests specific to Windows platform
    macos: Tests specific to macOS platform
    linux: Tests specific to Linux platform
    requires_ffmpeg: Tests that require ffmpeg
    requires_openai: Tests that require OpenAI API key
    requires_whisperx: Tests that require WhisperX

# Coverage options (if pytest-cov is installed)
[coverage:run]
source = scribe
omit =
    */tests/*
    */conftest.py
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Ignore deprecation warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore::ResourceWarning
